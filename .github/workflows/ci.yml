name: CI

on:
  push:
  pull_request:

# Минимальные права: CI только читает код.
permissions:
  contents: read

# Новый push в ту же ветку отменяет ещё не закончившийся прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      # Тот же PostgreSQL 16, что в docker-compose.yml; база сразу тестовая.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kvitto
          POSTGRES_PASSWORD: kvitto
          POSTGRES_DB: kvitto_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kvitto -d kvitto_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://kvitto:kvitto@localhost:5433/kvitto_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
