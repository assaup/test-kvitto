[project]
name = "kvitto-payments"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Задание требует pytest + httpx; Starlette рекомендует httpx2, но на работу тестов это не влияет.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
